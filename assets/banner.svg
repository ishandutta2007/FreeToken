<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c16"/>
      <stop offset="50%" stop-color="#11162b"/>
      <stop offset="100%" stop-color="#070913"/>
    </linearGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>

    <style>
      @keyframes floatPulse {
        0%, 100% { transform: translateY(0px) scale(1); opacity: 0.85; }
        50% { transform: translateY(-8px) scale(1.03); opacity: 1; filter: drop-shadow(0 0 16px rgba(0,242,254,0.6)); }
      }
      @keyframes beamFlow {
        0% { stroke-dashoffset: 120; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.9; }
      }
      .chip-core {
        animation: floatPulse 4s ease-in-out infinite;
        transform-origin: center;
      }
      .data-stream {
        stroke-dasharray: 8 16;
        animation: beamFlow 1.8s linear infinite;
      }
      .glow-circ {
        animation: pulseGlow 2.5s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#grid)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="120" r="160" fill="#00f2fe" opacity="0.08" filter="url(#glow)"/>
  <circle cx="1000" cy="300" r="180" fill="#a855f7" opacity="0.09" filter="url(#glow)"/>

  <!-- Circuit Lines & Data Streams -->
  <g opacity="0.55">
    <path d="M 120 210 L 350 210 L 420 160 L 520 160" fill="none" stroke="#00f2fe" stroke-width="2" class="data-stream"/>
    <path d="M 120 230 L 320 230 L 400 280 L 520 280" fill="none" stroke="#ec4899" stroke-width="2" class="data-stream"/>
    <path d="M 680 160 L 780 160 L 860 210 L 1080 210" fill="none" stroke="#4facfe" stroke-width="2" class="data-stream"/>
    <path d="M 680 280 L 800 280 L 880 230 L 1080 230" fill="none" stroke="#a855f7" stroke-width="2" class="data-stream"/>
  </g>

  <!-- Nodes -->
  <circle cx="120" cy="210" r="5" fill="#00f2fe" class="glow-circ"/>
  <circle cx="120" cy="230" r="5" fill="#ec4899" class="glow-circ"/>
  <circle cx="1080" cy="210" r="5" fill="#4facfe" class="glow-circ"/>
  <circle cx="1080" cy="230" r="5" fill="#a855f7" class="glow-circ"/>

  <!-- Left / Center Graphic: Dynamic MoE Router Core -->
  <g class="chip-core" transform="translate(180, 210)">
    <circle cx="0" cy="0" r="68" fill="rgba(17,24,39,0.7)" stroke="url(#neonCyan)" stroke-width="3" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="46" fill="rgba(168,85,247,0.15)" stroke="url(#accentPurple)" stroke-width="2"/>
    <polygon points="0,-24 21,12 -21,12" fill="none" stroke="#00f2fe" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="8" fill="#00f2fe" class="glow-circ"/>
    <!-- Orbiting Expert Indicators -->
    <circle cx="-50" cy="-40" r="6" fill="#ec4899"/>
    <circle cx="50" cy="-40" r="6" fill="#00f2fe"/>
    <circle cx="-50" cy="40" r="6" fill="#a855f7"/>
    <circle cx="50" cy="40" r="6" fill="#4facfe"/>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(360, 165)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="58" font-weight="900" fill="#ffffff" letter-spacing="1">
      Free<tspan fill="url(#neonCyan)">Token</tspan>
    </text>
    <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#94a3b8" letter-spacing="0.5">
      Edge-Native MoE LLM Serving with Bandwidth-Adaptive Execution
    </text>
    
    <!-- Pills / Feature Badges -->
    <g transform="translate(0, 75)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="135" height="34" rx="17" fill="rgba(0,242,254,0.1)" stroke="#00f2fe" stroke-width="1.2"/>
      <text x="67" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle">⚡ q* Policy</text>

      <!-- Pill 2 -->
      <rect x="148" y="0" width="165" height="34" rx="17" fill="rgba(168,85,247,0.12)" stroke="#a855f7" stroke-width="1.2"/>
      <text x="230" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#c084fc" text-anchor="middle">🧠 Zero-Bubble MoE</text>

      <!-- Pill 3 -->
      <rect x="325" y="0" width="165" height="34" rx="17" fill="rgba(236,72,153,0.12)" stroke="#ec4899" stroke-width="1.2"/>
      <text x="407" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#f472b6" text-anchor="middle">🚀 RTX 30/40/50 Ready</text>

      <!-- Pill 4 -->
      <rect x="502" y="0" width="150" height="34" rx="17" fill="rgba(34,197,94,0.12)" stroke="#22c55e" stroke-width="1.2"/>
      <text x="577" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#4ade80" text-anchor="middle">📦 Fast .ftw DMA</text>
    </g>
  </g>

  <!-- Bottom Border Glow Line -->
  <rect x="0" y="416" width="1200" height="4" fill="url(#neonCyan)"/>
</svg>
